<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas El Volcán | Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header id="encabezado">
        <div class="logo-contenedor">
            <img src="img/Logo El Volcan.jpg" alt="Logo Distribuidora de Gas El Volcán" class="logo">
            <h1>Distribuidora de Gas El Volcán</h1>
        </div>
        <p>Gas licuado a domicilio en Chillán y alrededores</p>

        <nav id="menu-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Catálogo</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
                <li><a href="registro.html">Registrarse</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>



    <!-- Contenido central con tarjeta blanca -->
   <main id="contenido">
        <section class="formulario-contenedor">
            <h2>Contacto</h2>

            <form id="formulario-contacto">
                <div class="grupo-form">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre">
                    <span class="mensaje-error" id="errorNombre"></span>
                </div>

                <div class="grupo-form">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
                    <span class="mensaje-error" id="errorCorreo"></span>
                </div>

                <div class="grupo-form">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                    <span class="mensaje-error" id="errorMensaje"></span>
                </div>

                <button type="submit" class="btn">Enviar Mensaje</button>
                <p id="mensajeExitoContacto" class="mensaje-exito"></p>

                <div class="enlaces-form">
                    <a href="index.html">Volver a la página principal</a>
                </div>
            </form>
        </section>
    </main>

    <footer id="pie">
        <p><small>&copy; <span id="anio-actual">2026</span> Distribuidora de Gas El Volcán - Todos los derechos reservados</small></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
