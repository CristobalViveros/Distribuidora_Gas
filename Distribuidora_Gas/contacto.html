<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas El Volcán | Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Encabezado idéntico al de login -->
  <header>
    <div class="header-content">
        <h1>Distribuidora de Gas El Volcán</h1>
        <p>Gas licuado a domicilio en Chillán y alrededores</p>
    </div>

    <!-- EL NAV DEBE IR DENTRO DEL HEADER -->
    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Catálogo</a>
        <a href="login.html">Iniciar Sesión</a>
        <a href="registro.html">Registrarse</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>



    <!-- Contenido central con tarjeta blanca -->
   <main>
    <!-- Tarjeta blanca centrada idéntica a la de Login -->
    <div class="form-card">
        <h2>Contacto</h2>
        
        <form id="formulario-contacto">
            <div class="campo">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre">
                <span class="error-msg" id="errorNombre"></span>
            </div>

            <div class="campo">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
                <span class="error-msg" id="errorCorreo"></span>
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..."></textarea>
                <span class="error-msg" id="errorMensaje"></span>
            </div>

            <button type="submit">Enviar Mensaje</button>
        </form>

        <div class="enlace-secundario">
            <a href="index.html">Volver a la página principal</a>
        </div>
    </div>
</main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 Distribuidora de Gas El Volcán - Todos los derechos reservados</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
