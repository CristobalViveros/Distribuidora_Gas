<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gas El Volcán | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Distribuidora de Gas El Volcán</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Pedir Gas</a>
            <a href="login.html">Iniciar Sesión</a>
        </nav>
    </header>

    <main>
        <section class="formulario-contenedor">
            <h2>Acceso al Sistema</h2>
            
            <!-- Formulario con un ID para manipularlo con JavaScript -->
            <form id="formLogin">
                <div class="grupo-form">
                    <label for="email">Correo Electrónico:</label>
                    <input type="text" id="email" name="email" placeholder="ejemplo@correo.com">
                    <span class="mensaje-error" id="errorEmail"></span>
                </div>

                <div class="grupo-form">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
                    <span class="mensaje-error" id="errorPassword"></span>
                </div>

                <button type="submit" class="btn">Ingresar</button>
                <p id="mensajeExito" class="mensaje-exito"></p>

                <div class="enlaces-form">
                    <a href="registro.html">¿No tienes cuenta? Regístrate aquí</a><br><br>
                    <a href="index.html">Volver a la página principal</a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Distribuidora de Gas El Volcán. Todos los derechos reservados.</p>
    </footer>

    <!-- Vinculación del archivo JavaScript antes de cerrar el body -->
    <script src="js/script.js"></script>
</body>
</html>
